<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Official artist links">

  <title>Shayan Yo — Official Links</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <main class="page">

    <!-- Profile -->
    <header class="profile">

      <img class="avatar" src="assets/images/artist.png" alt="Artist Name">

      <h1>Shayan Yo</h1>

      <p class="username">@artistusername</p>

      <p class="bio"></p>

    </header>


    <div class="sections">

      <!-- Social -->
      <section class="section" aria-labelledby="social-title">

        <h2 id="social-title">Social</h2>

        <div class="links">

          <!-- Instagram -->
          <a class="link-card" href="https://www.instagram.com/shayanyo_" target="_blank" rel="noopener noreferrer">
            <span class="icon">
              <i class="fa-brands fa-instagram"></i>
            </span>

            <span class="link-text">
              <strong>Instagram</strong>
              <small>@artistusername</small>
            </span>

            <span class="arrow">→</span>
          </a>


          <!-- Telegram -->
          <a class="link-card" href="https://t.me/shayannyo" target="_blank" rel="noopener noreferrer">
            <span class="icon">
              <i class="fa-brands fa-telegram"></i>
            </span>

            <span class="link-text">
              <strong>Telegram</strong>
              <small>Official channel</small>
            </span>

            <span class="arrow">→</span>
          </a>


          <!-- YouTube -->
          <a class="link-card" href="https://www.youtube.com/@shayanyo_official" target="_blank"
            rel="noopener noreferrer">
            <span class="icon">
              <i class="fa-brands fa-youtube"></i>
            </span>

            <span class="link-text">
              <strong>YouTube</strong>
              <small>Music and videos</small>
            </span>

            <span class="arrow">→</span>
          </a>

          <!-- Spotify -->
          <a class="link-card"
            href="https://open.spotify.com/artist/1auD6S9qViY72nLUvLrL6a?si=ADf_JQxaRMyVU50L1mU2yw&nd=1&dlsi=62065d1360ba4432"
            target="_blank" rel="noopener noreferrer">
            <span class="icon">
              <i class="fa-brands fa-spotify"></i>
            </span>

            <span class="link-text">
              <strong>Spotify</strong>
              <small>Listen to the music</small>
            </span>

            <span class="arrow">→</span>
          </a>

        </div>

      </section>

      <!-- Music -->
      <section class="section" aria-labelledby="music-title">

        <h2 id="music-title">Music</h2>

        <div class="links">

          <!-- Latest Release -->
          <a class="link-card" href="https://music.apple.com/it/artist/shayan-yo/1612475671?l=en-GB" target="_blank"
            rel="noopener noreferrer">
            <span class="icon">
              <i class="fa-solid fa-music"></i>
            </span>

            <span class="link-text">
              <strong>Latest Release</strong>
              <small>Listen to the latest song</small>
            </span>

            <span class="arrow">→</span>
          </a>

        </div>

      </section>

      <!-- Official -->
      <section class="section" aria-labelledby="official-title">

        <h2 id="official-title">Official</h2>

        <div class="links">

          <!-- Official Website -->
          <a class="link-card" href="#" target="_blank" rel="noopener noreferrer">
            <span class="icon">
              <i class="fa-solid fa-globe"></i>
            </span>

            <span class="link-text">
              <strong>Official Website</strong>
              <small>artist.example</small>
            </span>

            <span class="arrow">→</span>
          </a>

        </div>

      </section>

    </div>

  </main>

  <footer>
    © 2026 Shayan Yo. All rights reserved.
  </footer>

  <script src="js/main.js" defer></script>

</body>

</html>
